<section data-view="journal">
  <div class="view-head">
    <h1>JOURNAL &amp; MEMORIES</h1>
    <p class="view-sub">Longer reflections, date night recaps, milestones, and shared gratitude.</p>
  </div>

  <div class="paper">
    <div class="form-grid">
      <div class="form-row">
        <input type="text" id="journaltitle" class="text-input" placeholder="Entry title (e.g. Sunday Walk &amp; Tacos)...">
        <select id="journalauthor" class="select-input">

        </select>
      </div>
      <textarea id="journalbody" class="textarea-input" rows="4" placeholder="Write thoughts, memories, reflections, what went well..."></textarea>
      <div class="form-actions">
        <button class="btn" id="journaladdbtn">SAVE ENTRY</button>
      </div>
    </div>
  </div>

  <div id="journallist" class="journal-list"></div>
</section>
