<section data-view="log">
  <div class="view-head">
    <h1>DAILY LOG</h1>
    <p class="view-sub">Quick timestamped notes, quotes, photos, links, and ideas.</p>
  </div>

  <div class="paper">
    <div class="form-row">
      <input type="text" id="loginput" class="text-input" placeholder="Drop a thought, link, or note..." maxlength="280">
      <select id="logtag" class="select-input">
        <option value="moment">moment</option>
        <option value="quote">quote</option>
        <option value="idea">idea</option>
        <option value="link">link</option>
      </select>
      <button class="btn" id="logaddbtn">POST</button>
    </div>
    <div class="form-row">
      <input type="file" id="photofile" accept="image/*" multiple hidden>
      <button class="btn wide" id="photobtn">ADD PHOTOS</button>
      <span class="sub">Photos are dithered to 1-bit on the way in: small, private, and ready for a photocopier. Type a caption first and it lands on the first one.</span>
    </div>
    <div class="filter-row">
      <span class="sub">filter:</span>
      <span id="logfilters"></span>
    </div>
  </div>

  <div id="loglist" class="log-stream"></div>
</section>
