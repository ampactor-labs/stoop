<section data-view="scraps">
  <div class="view-head">
    <h1>SCRAPS</h1>
    <p class="view-sub">Everything you wrote down. The desk pulls from here.</p>
  </div>

  <div class="paper">
    <input type="text" id="scraptitle" class="text-input" maxlength="60" placeholder="Title, if it has one">
    <textarea id="loginput" class="textarea-input" rows="2" placeholder="A line, or a page."></textarea>
    <div class="form-row">
      <button class="btn" id="logaddbtn">KEEP IT</button>
      <input type="file" id="photofile" accept="image/*" multiple hidden>
      <button class="btn quiet" id="photobtn">PHOTOS</button>
      <span class="sub" id="logfilters"></span>
    </div>
    <p class="hint">A line, a page or a photograph. A scrap with a title, or a long one, becomes a piece of its own at the desk; short ones run together as one column.</p>
  </div>

  <div id="loglist" class="log-stream"></div>
</section>
