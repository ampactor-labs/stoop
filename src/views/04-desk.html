<section data-view="desk">
  <div class="view-head">
    <h1>THE DESK</h1>
    <p class="view-sub" id="deskhead">issue №01</p>
  </div>

  <div class="paper">
    <div class="form-row">
      <input type="text" id="piecetitle" class="text-input" maxlength="60" placeholder="Title">
      <select id="piecekind" class="text-input">
        <option value="essay">essay</option>
        <option value="photos">photos</option>
        <option value="log">log</option>
        <option value="mix">mix</option>
        <option value="recipe">recipe</option>
        <option value="letters">letters</option>
      </select>
      <button class="btn" id="piecesubmitbtn">SUBMIT</button>
    </div>
    <textarea id="piecebody" class="text-input" rows="4" placeholder="The piece."></textarea>
    <button class="btn quiet" id="drawsourcesbtn">PULL IN THE NEW SCRAPS</button>
  </div>

  <div class="paper">
    <h2>THE TRAY</h2>
    <div id="desktray"></div>
    <p class="sub">A cut is not a delete. It keeps, and it can run next time.</p>
  </div>

  <div class="paper">
    <textarea id="editornote" class="text-input" rows="2" placeholder="Editor's note, if you want one."></textarea>
    <div class="form-row">
      <label class="sub" for="bellinput">BELL</label>
      <input type="date" id="bellinput" class="text-input">
      <button class="btn quiet" id="savebellbtn">SET</button>
    </div>
    <div class="press-actions">
      <button class="btn" id="compileissuebtn">FLOW ONTO THE PAGES</button>
      <button class="btn done" id="buildissuebtn">RING THE BELL</button>
    </div>
    <p class="sub">The bell puts this issue on the shelf as it stands and hands the desk on.</p>
  </div>
</section>
